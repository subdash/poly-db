apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvs
  namespace: kvs
spec:
  serviceName: kvs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvs
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: kvs
        image: kvs-server:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: KVS_ADDR
          value: 0.0.0.0:3000
        - name: KVS_DATA_DIR
          value: /var/lib/kvs
        - name: KVS_FSYNC
          value: always
        volumeMounts:
        - name: data
          mountPath: /var/lib/kvs
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2

        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 2

  # Provision unique PVC for each pod replica so that each one gets its own storage volume
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

